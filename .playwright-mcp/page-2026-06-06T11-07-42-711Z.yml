              - paragraph [ref=e151]: 清代白话长篇才子佳人小说。一名《闺门秘术剑仙传》。四卷五十回。不题撰人。成书于清光绪三十三年(1907)。现存主要版本有清光绪三十三年(1907)沪上书局石印本,藏国家图书馆;清宣统二年(1910)石印本,藏上海图书馆。1994年中央民族学院出版社“馆藏足本明清小说系列”排印本。落魄文人兆璧、兆琨科考中试，县令夏国华欲将女儿瑶云配兆琨。其子均祥不肖，私自将妹另许叶槐之子叶开泰为妾，瑶云不从。均祥之仆狗儿欲奸瑶云之婢庆喜未逞，反诬庆喜与人通奸，国华怒杖均祥，坚拒叶府婚姻，被陷去职。新县令勾结开泰逼娶瑶云，瑶云携婢出逃，历尽艰辛。后二兆考中状元、探花，群凶伏法，才子佳人终成眷属。
