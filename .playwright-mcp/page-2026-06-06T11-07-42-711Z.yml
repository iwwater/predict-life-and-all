              - paragraph [ref=e121]: 沈醉著。文史资料出版社1984年出版。该书除书首、书尾附有作者写的军统概况、前言、后记及《人民日报》记者胡思升所作的采访录外，从20个方面分别披露了蒋介石国民党的军统特务组织培训特务的内幕，抗战前后在上海、重庆，解放前夕在云南昆明的罪恶活动，及中美特种技术合作所与保密局的内幕；揭露了蒋介石国民党及其特务组织暗杀进步民主人士杨杏佛、史量才、李公朴、闻一多、爱国将领杨虎城、杨杰及中共领导人，囚禁抗日将军张学良，镇压爱国学生运动等罪行；描述了国民党领导层之间，军统特务头目之间勾心斗角，尔虞我诈的丑恶行径及军统特务头目戴笠、毛人凤、唐纵等人的反动历史，包括作者身为军统特务头目曾犯下的一些历史罪行。书中披露史实均系作者亲历、亲见、亲闻，且大都鲜为人知，真实、具体、深入，具有极高的史料价值。
