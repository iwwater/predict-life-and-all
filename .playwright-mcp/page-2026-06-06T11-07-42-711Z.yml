              - paragraph [ref=e181]: 黄药眠（1903年1月14日—1987年9月3日），原名黄访，曾用名黄恍、黄吉、番茄，笔名坦克、方格、达史，广东梅县（今梅州）人。他是中国现代史上集诗人、作家、文艺理论家、美学家、教育家于一身的全能型学者，更是投身革命洪流、坚守理想信念的文化战士，其一生横跨革命、文艺、教育三大领域，留下了深刻而持久的影响。 黄药眠的文学之路始于少年时期，岭南的文化浸润与“五四”新文化浪潮的冲击，让他早早萌发了对文字的热爱。1921年，中学毕业的他考入广东高等师范学校英文系（毕业前该校更名为广东大学），期间广泛涉猎中西文学，既沉醉于楚辞、汉魏乐府等古典诗文，也深受泰戈尔、雪莱等中外诗人的影响，1924年开始尝试诗歌创作，凭借清丽隽永的文笔成为校园知名才子，得到创造社成员成仿吾、王独清的赏识。 1925年毕业后，黄药眠先后在广东大埔百候中学、潮州金山中学任教，后任职于中山大学文学院图书馆。1927年，大革命失败后，他应成仿吾之邀赴上海，加入创造社出版部任助理编辑，正式开启文学创作生涯，同时在暨南大学附中、上海艺术大学兼课，将文学理想与教育实践初步结合。1928年，他出版首部诗集《黄花岗上》，这部融合自由浪漫情怀与楚辞古风的作品影响深远，茅盾盛赞其兼具现代感与古典韵致，奠定了他在诗坛的地位。同年，黄药眠加入中国共产党，从此将文学追求与革命事业紧密相连，在马克思主义思想的指引下，确立了为社会进步而创作的方向。 1929年冬，受党组织委派，黄药眠赴莫斯科青年共产国际东方部从事英文翻译工作，这段经历让他对国际革命形势有了更深刻的认知。1933年冬回国后，他出任共青团中央宣传部长，积极投身革命宣传工作，却不幸于1934年被国民党政府逮捕，判处十年徒刑。狱中岁月的磨难并未磨灭他的意志，1937年，经八路军办事处保释出狱后，他即刻重返革命阵营，先在延安新华通讯社担任翻译，后辗转至抗战文化重镇桂林，与胡愈之、范长江等人共同组织国际新闻社，出任总编辑，同时兼任“文协”桂林分会秘书长，为传递抗战声音、凝聚文化力量奔走呼号。 抗战期间，黄药眠一边组织文艺讲习班、开展文艺大众化讨论，一边以笔为刃回应文艺界乱象。针对抗战诗歌的空泛化与“主观战斗精神论”的影响，他撰写《论诗》《论约瑟夫的外套》等系列论著，确立诗歌审美标准，厘清文艺创作中的主观与客观关系，成为国统区传播延安文艺思想的重要旗手。1941年起，他先后辗转香港、梅县、成都、昆明等地，协助廖承志开展工作，从事国际宣传与文艺理论研究，1944年在成都加入中国民主同盟，进一步拓展民主革命的文化阵地。 抗战胜利后，黄药眠的革命与文艺活动愈发活跃。1946年初，他在广州任农工民主党《人民报》主笔，主办民盟机关刊物《民主星期刊》及同人刊物《民主与文化》，积极宣传民主进步思想；同年秋赴香港，出任民盟中央机关刊物《光明报》主编、“文协”香港分会主席，并参与创办达德学院，担任文学哲学系主任，邀请茅盾、曹禺等名家授课，为革命事业培养了大批人才。他始终坚守在文化斗争前线，发表大量时事评论与文艺作品，长诗《桂林底撤退》、小说集《暗影》《再见》等作品，真实记录了时代动荡，彰显了革命者的担当。1949年5月，黄药眠从香港赴北京，参加第一次全国文代会，见证新中国文艺事业的开端。 新中国成立后，黄药眠全身心投入教育事业，受聘为北京师范大学文科一级教授，后担任中文系主任，成为新中国文艺学学科的开拓者。1953年，他牵头成立全国首个文艺理论教研室，受教育部委托编写首个高校文学概论教学大纲，1954年主编《文学理论学习参考资料》，1956年招收新中国首个文艺学研究生班，为我国文艺理论学科建设铺就基石。1957年，他牵头举办新中国首个美学问题系列讲座，汇聚朱光潜、蔡仪等学界名家，推动美学研究的普及与深化。 尽管1957年黄药眠被错划为“右派”，历经多年磨难，但他始终坚守学术信仰与人格气节。1979年平反后，已逾七旬的他仍潜心治学，培养博士、硕士研究生，发表大量诗歌、散文与美学论文。他的美学思想独具特色，提出“为革命而奋斗的生活是美的”这一核心观点，主张美源于为人民利益的奋斗实践，强调审美感的社会性与历史性，反对脱离生活的纯美追求；同时肯定形式美的价值，认为形式终究为内容服务，形成了鲜明的功利性美学主张，在中国当代美学史上占据独特地位。 晚年的黄药眠依然笔耕不辍，80岁高龄完成口述自传《动荡——我所经历的半个世纪》，回望波澜壮阔的一生。他历任第一届全国人大代表，第三、四、五届全国政协委员，第六届全国政协常委，民盟中央常委，中国文联常务理事兼副秘书长，中国作协顾问等职，将毕生精力奉献给国家的文艺与教育事业。1987年9月3日，黄药眠逝世，享年84岁。 黄药眠的创作与研究横跨多体裁、多领域，著作等身。诗歌方面，有《黄花岗上》《桂林底撤退》《英雄颂》《黄药眠诗集》等，兼具抒情性与革命性；小说与散文领域，著有小说集《暗影》《再见》，散文集《美丽的黑海》《朝鲜——英雄的国度》等，文字优美，兼具思想深度与时代温度；文艺理论与美学研究方面，出版《沉思集》《批判集》《初学集》《迎新集》《黄药眠美学论文集》《黄药眠文艺论文选集》等，其中《论诗》《论约瑟夫的外套》成为文艺理论经典；此外，他还翻译屠格涅夫《烟》、辛克莱《工人杰麦》等多部外文作品，主编《文学理论学习参考资料》，留下了丰富的学术遗产。 史学家唐振常曾评价黄药眠“博学多才”，友人尊称其为“黄大师”，这一称号既彰显了他在文学、理论、教育领域的全能成就，也饱含对其人格风骨的敬仰。黄药眠以一生践行了“为人民而创作、为真理而奋斗”的信念，其革命情怀、学术思想与教育贡献，至今仍在中国现当代文艺与教育史上闪耀着不朽光芒。
