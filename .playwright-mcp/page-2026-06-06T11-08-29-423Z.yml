          - img "子平真诠" [ref=e55]
          - paragraph [ref=e56]: 《子平真诠》是中国传统命理学著作，为清代乾隆进士沈孝瞻先生所著，全书共四十八章，现据考为明代《耕寸集》命理笔记。《子平真诠》是传统子平命理学“前三本”（子平真诠，渊海子平，三命通会）中分量最少，但是理论最为精辟，论述最为恰到好处的著作。
