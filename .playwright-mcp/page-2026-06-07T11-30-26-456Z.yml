          - generic [ref=e272]:
            - paragraph [ref=e276]: 好的，请允许我以融通中西的视角，为您解读这幅独特的生命图景。
            - heading "整体印象：浓墨重彩的聚焦型生命" [level=3] [ref=e277]
            - paragraph [ref=e278]: 这幅盘面呈现出一个非常强烈的主题——“聚焦”与“密度”。八字方面，庚金日主，身强，年柱庚午、月柱辛巳，天干庚辛并透，地支巳午火旺，整个命局金火两旺，气势雄浑，如同一块被烈火反复锻造的精金。西方占星盘中，更是出现了罕见的“群星合相”奇观：太阳、月亮、水星、金星、火星、木星、土星七颗星体全部汇聚在双鱼座与白羊座之间极小的度数范围内（约28°双鱼至1°白羊），形成压倒性的能量汇聚。这种格局，在传统八字中可喻为“众星拱斗”或“比劫林立”，在星盘解读中则象征着一个巨大的内在矛盾与统一系统。
            - paragraph [ref=e279]:
              - strong [ref=e280]: 从整体看，您的人生基调倾向于“高度整合与强大张力”。
              - text: 您是一个能量密度极高的人，生命的各个领域——意志、情感、思维、关系、行动——并非各自为政，而是被一股强大的力量拧在一起，共同指向同一个核心课题。这既是巨大的天赋，也是巨大的挑战。您需要努力驾驭这股洪流，而非被其裹挟。
            - heading "性格特质：刚烈内核与海洋般的情感" [level=3] [ref=e281]
            - list [ref=e282]:
              - listitem [ref=e283]:
                - strong [ref=e284]: 八字视角（刚毅果决）
                - text: ：日主庚金，坐辰土印库，又有辰、庚、辛比劫相助，性格底色是刚强、重义气、有主见，不喜受人摆布。月令巳火为七杀，年支午火为正官，官杀混杂却得火炼，代表您内心有强烈的规则意识与权威感，容易在事业上展现出不畏挑战、敢作敢为的魄力。《滴天髓》云：“庚金带煞，刚健为最”，在您身上体现得较为明显。不过，土旺金埋（三辰土），也有思虑过重、有时会感到被环境束缚或内心压抑的一面。
              - listitem [ref=e285]:
                - strong [ref=e286]: 西方占星视角（情感深海）
                - text: ：上升为敏感内敛的巨蟹，但所有内行星（日月水金火）全部落在双鱼座末度和白羊座初度。这形成了极为罕见的两极特征：
                - strong [ref=e287]: 双鱼的慈悲、想象力与白羊的冲动、自我表达并存。
                - text: 尤其是太阳（自我）与月亮（情感）精准合相，更与火星、金星、水星紧密关联。这表示您的理性、情感、行动、爱与沟通，几乎完全融为一体，难分彼此。您可能时而感到自己像一片无边无际的海洋（双鱼），时而又像一股急于破土而出的火焰（白羊），内在的“我”非常强大，且极易被情绪所驱动。
            - paragraph [ref=e288]:
              - strong [ref=e289]: 中西合参：
              - text: 八字中庚金的“刚”与星盘中群星聚集的“烈”，互相印证了您目标感强、不轻易妥协的特质。而八字中的“印星（辰土）”和星盘中的“双鱼座能量”则揭示了另一面：您内心深处其实情感丰沛，甚至有些浪漫的理想主义，只是外在表现常被金火的刚烈所掩盖。这种“外刚内柔”或“外冷内热”的张力，是理解您性格的关键。
            - heading "事业与方向：需要燃烧的舞台" [level=3] [ref=e290]
            - list [ref=e291]:
              - listitem [ref=e292]:
                - strong [ref=e293]: 八字视角（金火相攻，宜泄不宜克）
                - text: ：身强庚金，喜用神为木、水、火（以泄其过旺之气或克其比劫）。金火相战，事业上容易出现激烈的竞争或变革。命局官杀并透，代表天生适合在
                - strong [ref=e294]: 规则性强、有权威性的领域
                - text: （如公检法、管理、技术标准制定）里发挥。年柱午火正官得用，利于正统职场，但月柱辛巳劫财坐七杀，则提示在合作、合伙关系中需特别留意，容易出现利益纠纷或朋友反目的倾向。当前阶段，您的大运走向很可能在
                - strong [ref=e295]: 强化“火”或“水”
                - text: 的调候作用，这意味着行业选择上，
                - strong [ref=e296]: 科技、能源、传媒、创意、文化、金融流动性
                - text: 等充满活力的领域比稳定重复的行业更合适。
              - listitem [ref=e297]:
                - strong [ref=e298]: 西方占星视角（开创性的“点状爆发”）
                - text: ：群星合相白羊座与双鱼座，能量极其集中且带有开创性。土星、木星与太阳的合相，预示事业往往与
                - strong [ref=e299]: 长期的责任、结构性的构建
                - text: 有关，且容易在年轻时（土星回归前）就承担重要角色。木星赋予幸运与扩张，土星施加限制与考验，您的人生需要经历“先苦后甜”的历练。上升巨蟹，则提示您事业的根基或最终的价值感，可能来源于
                - strong [ref=e300]: 家庭、情感、安全感的建立
                - text: ，比如不动产、咨询、心理或餐饮等与“家”或“关怀”相关的领域。当前，木土合相在1°白羊，这是一个
                - strong [ref=e301]: 周期性的“重启”点
                - text: ，您的职业生涯可能正处在一个全新的、需要主动出击的“篇章”开端，但也伴随着巨大的压力与责任。
            - paragraph [ref=e302]:
              - strong [ref=e303]: 中西合参：
              - text: 两种体系都指向一个共同点：
              - strong [ref=e304]: 您需要在一个充满挑战、规则明确、能发挥主观能动性的专业领域里“燃烧”自我。
              - text: 事业的成功不靠“找捷径”，而在于“正面迎击”——将金火的刚烈锻造为专业深度，将群星汇聚的能量聚焦于一个核心目标。建议您留意与
              - strong [ref=e305]: 技术研发、项目攻坚、创意整合、教育培训、法律咨询
              - text: 相关的方向。
            - heading "当前提示与建议（针对当前阶段）" [level=3] [ref=e306]
            - paragraph [ref=e307]: 当前正值2026年中，结合您命盘的特质，建议您留意以下几点：
            - list [ref=e308]:
              - listitem [ref=e309]:
                - paragraph [ref=e310]:
                  - strong [ref=e311]: 警惕“内耗”，聚焦核心能量
                  - text: ：当前星盘与八字均显示能量高度集中但稍显“淤塞”。您容易陷入“想做就立刻行动”与“过度思考、情感内耗”的拉锯战。
                  - strong [ref=e312]: 特别建议您学习“断舍离”，无论是人际关系、工作任务还是内心杂念。
                  - text: 明确当前阶段最核心的1-2个目标，其他旁枝末节可暂缓或授权。请避免在多个方向上同时出击，那只会分散您宝贵但有限的心理能量。
              - listitem [ref=e313]:
                - paragraph [ref=e314]:
                  - strong [ref=e315]: 合作中的“清晰界限”与“谨慎背书”
                  - text: ：从八字看，您的比劫（同辈、朋友、合作伙伴）既可能是助力也可能是阻力。当前阶段，与人合伙、投资或签署重要协议时，
                  - strong [ref=e316]: 请务必确立清晰、书面化的责权利边界
                  - text: 。您信任他人，但不要将信任等同于完全放弃风险管理。尤其注意避免因“兄弟情义”而做出超出自己能力范围或法律风险的承诺。
              - listitem [ref=e317]:
                - paragraph [ref=e318]: "**关照身心健康，"
          - generic [ref=e271]: 以上为传统文化象征视角的参考,非科学预测,重大决定请结合现实并咨询专业人士。
