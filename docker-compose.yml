services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: mystic-hub-server:0.1.0
    container_name: mystic-hub-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx, sys; sys.exit(0 if httpx.get('http://localhost:8000/api/methods', timeout=5).status_code == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: mystic-hub-web:0.1.0
    container_name: mystic-hub-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy
    environment:
      # nginx.conf proxies /api/ to http://server:8000 (compose service name)
      - NGINX_PORT=80
