name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "fastapi>=0.110" "uvicorn[standard]>=0.27" "pydantic>=2.6" \
                      "python-multipart>=0.0.9" "httpx>=0.27" "pytest>=8.0"

      - name: Pre-fetch JPL ephemeris (de421.bsp is gitignored)
        run: python -c "from skyfield.api import load; load('de421.bsp')"

      - name: Run test suite
        run: python -m pytest tests/ -q

  web:
    name: web (tsc + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
